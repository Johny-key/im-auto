name: Scrape China (che168.com)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - dump

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: parser
        run: |
          pip install -r requirements.txt
          pip install playwright
          playwright install chromium --with-deps

      - name: Open SSH tunnel to VPS DB
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=60 \
            -N -L 5432:localhost:5432 \
            root@185.219.41.49 &
          sleep 5
          echo "SSH tunnel started"

      - name: Run scraper
        working-directory: parser
        run: python3 scraper_china.py ${{ github.event.inputs.mode }}
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:encar@localhost:5432/encar"
          CHINA_PAGE_SIZE: "10"
          CHINA_NAV_TIMEOUT: "60000"
          CHINA_EXTRA_WAIT_MS: "5000"
          CHINA_INCREMENTAL_PAGES: "100"
          CHINA_CHECKPOINT_PATH: "/tmp/china_checkpoint.json"

      - name: Upload diagnostics (dump mode)
        if: github.event.inputs.mode == 'dump' && always()
        uses: actions/upload-artifact@v4
        with:
          name: che168-diagnostics
          path: |
            /tmp/che168_screenshot.png
            /tmp/che168_page.html
          if-no-files-found: ignore
