name: Scrape China (che168.com)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - dump

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get install -y sshpass

      - name: Install dependencies
        working-directory: parser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper (save to JSON)
        working-directory: parser
        run: python3 scraper_china.py ${{ github.event.inputs.mode }}
        env:
          CHINA_OUTPUT_JSON: "/tmp/china_cars.json"
          CHINA_PAGE_SIZE: "10"
          CHINA_NAV_TIMEOUT: "60000"
          CHINA_EXTRA_WAIT_MS: "5000"
          CHINA_INCREMENTAL_PAGES: "100"
          CHINA_CHECKPOINT_PATH: "/tmp/china_checkpoint.json"

      - name: Upload JSON to VPS and import
        if: github.event.inputs.mode != 'dump'
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o PasswordAuthentication=yes -o PubkeyAuthentication=no"

          # Check if JSON was created and has cars
          if [ ! -f /tmp/china_cars.json ]; then
            echo "ERROR: /tmp/china_cars.json not created by scraper"
            exit 1
          fi
          CAR_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/china_cars.json')); print(len(d))")
          echo "Cars in JSON: $CAR_COUNT"
          if [ "$CAR_COUNT" = "0" ]; then
            echo "No cars scraped, skipping import"
            exit 0
          fi

          # Copy scraped data to VPS
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp $SSH_OPTS \
            /tmp/china_cars.json \
            root@185.219.41.49:/tmp/china_cars.json

          # Copy JSON into container and run import inside it
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh $SSH_OPTS root@185.219.41.49 \
            "docker cp /tmp/china_cars.json parser-api-1:/tmp/china_cars.json && \
             docker exec parser-api-1 python3 /app/import_china.py /tmp/china_cars.json"

      - name: Upload diagnostics (dump mode)
        if: github.event.inputs.mode == 'dump' && always()
        uses: actions/upload-artifact@v4
        with:
          name: che168-diagnostics
          path: |
            /tmp/che168_screenshot.png
            /tmp/che168_page.html
          if-no-files-found: ignore
