name: Scrape China (che168.com)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - dump

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get install -y sshpass

      - name: Install dependencies
        working-directory: parser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper (save to JSON)
        working-directory: parser
        run: |
          # Retry up to 3 times — GitHub Actions IPs rotate between blocked/allowed
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt ==="
            python3 scraper_china.py ${{ github.event.inputs.mode }} && break
            if [ $attempt -lt 3 ]; then
              echo "Scraper failed or got 0 cars — waiting 30s before retry..."
              sleep 30
            fi
          done
          # Check that we actually got some cars (only for non-dump modes)
          if [ "${{ github.event.inputs.mode }}" != "dump" ]; then
            COUNT=$(python3 -c "import json; d=json.load(open('/tmp/china_cars.json')) if __import__('os').path.exists('/tmp/china_cars.json') else []; print(len(d))" 2>/dev/null || echo 0)
            echo "Cars collected: $COUNT"
            if [ "$COUNT" = "0" ]; then
              echo "ERROR: 0 cars after $attempt attempts — likely blocked IP"
              exit 1
            fi
          fi
        env:
          CHINA_OUTPUT_JSON: "/tmp/china_cars.json"
          CHINA_PAGE_SIZE: "10"
          CHINA_NAV_TIMEOUT: "60000"
          CHINA_EXTRA_WAIT_MS: "5000"
          CHINA_INCREMENTAL_PAGES: "100"
          CHINA_CHECKPOINT_PATH: "/tmp/china_checkpoint.json"

      - name: Upload JSON to VPS and import
        if: github.event.inputs.mode != 'dump'
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o PasswordAuthentication=yes -o PubkeyAuthentication=no"

          # Check if JSON was created and has cars
          if [ ! -f /tmp/china_cars.json ]; then
            echo "ERROR: /tmp/china_cars.json not created by scraper"
            exit 1
          fi
          CAR_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/china_cars.json')); print(len(d))")
          echo "Cars in JSON: $CAR_COUNT"
          if [ "$CAR_COUNT" = "0" ]; then
            echo "No cars scraped, skipping import"
            exit 0
          fi

          # Copy scraped data to VPS
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp $SSH_OPTS \
            /tmp/china_cars.json \
            root@185.219.41.49:/tmp/china_cars.json

          # Copy JSON into container and run import inside it
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh $SSH_OPTS root@185.219.41.49 \
            "docker cp /tmp/china_cars.json parser-api-1:/tmp/china_cars.json && \
             docker exec parser-api-1 python3 /app/import_china.py /tmp/china_cars.json"

      - name: Upload diagnostics (dump mode)
        if: github.event.inputs.mode == 'dump' && always()
        uses: actions/upload-artifact@v4
        with:
          name: che168-diagnostics
          path: |
            /tmp/che168_screenshot.png
            /tmp/che168_page.html
            /tmp/che168_raw_response.json
          if-no-files-found: ignore
