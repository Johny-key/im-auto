name: Scrape China (che168.com)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scrape mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - dump

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get install -y sshpass

      - name: Install dependencies
        working-directory: parser
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper (save to JSON)
        working-directory: parser
        run: python3 scraper_china.py ${{ github.event.inputs.mode }}
        env:
          CHINA_OUTPUT_JSON: "/tmp/china_cars.json"
          CHINA_PAGE_SIZE: "10"
          CHINA_NAV_TIMEOUT: "60000"
          CHINA_EXTRA_WAIT_MS: "5000"
          CHINA_INCREMENTAL_PAGES: "100"
          CHINA_CHECKPOINT_PATH: "/tmp/china_checkpoint.json"

      - name: Upload JSON to VPS and import
        if: github.event.inputs.mode != 'dump'
        run: |
          # Copy scraped data to VPS
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp \
            -o StrictHostKeyChecking=no \
            /tmp/china_cars.json \
            root@185.219.41.49:/tmp/china_cars.json

          # Run import on VPS (connects to local DB, no SSL issues)
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            root@185.219.41.49 \
            "cd /root/parser && python3 import_china.py /tmp/china_cars.json"

      - name: Upload diagnostics (dump mode)
        if: github.event.inputs.mode == 'dump' && always()
        uses: actions/upload-artifact@v4
        with:
          name: che168-diagnostics
          path: |
            /tmp/che168_screenshot.png
            /tmp/che168_page.html
          if-no-files-found: ignore
